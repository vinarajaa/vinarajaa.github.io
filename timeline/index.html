:root{--cream:#ffe9cf;--ink:#270f03;--lavender:#ca9dfe;--pink:#f897b4}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Worksans,Arial,sans-serif}a{color:inherit}button{color:inherit;font:inherit}.shell{width:min(100% - 2rem,92rem);margin:auto;padding:1rem 0 5rem}.topbar{display:flex;justify-content:space-between;gap:1rem;padding:.65rem 0 2.5rem}.pill{display:inline-flex;align-items:center;gap:.55rem;padding:.7rem .9rem;border:2px solid var(--ink);border-radius:999px;font-size:.75rem;font-weight:800;text-decoration:none;transition:.2s}.pill:hover{transform:translateY(-2px);box-shadow:3px 4px 0 var(--ink)}.pill.dark{background:var(--ink);color:var(--cream)}.hero{display:grid;grid-template-columns:1.35fr .65fr;gap:2rem;align-items:end;padding:clamp(1rem,4vw,3rem) 0 clamp(3rem,6vw,6rem)}.eyebrow{margin:0 0 1rem;font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}h1{max-width:10ch;margin:0;font-family:Anton,Impact,sans-serif;font-size:clamp(4.2rem,11vw,10rem);font-weight:400;line-height:.79;text-transform:uppercase}.hero-copy{max-width:29rem;margin:0;font-size:clamp(1rem,1.5vw,1.2rem);line-height:1.55}.note{display:flex;align-items:center;gap:.6rem;margin-top:1.3rem;font-size:.76rem;font-weight:750}.note i{width:.65rem;height:.65rem;border-radius:50%;background:#10cd00;box-shadow:0 0 0 5px #10cd0024}.explorer{display:grid;grid-template-columns:minmax(19rem,.72fr) minmax(0,1.28fr);min-height:40rem;overflow:hidden;border:2px solid var(--ink);border-radius:1.35rem;box-shadow:10px 12px 0 var(--ink);background:#ffffff26}.nav{padding:clamp(1rem,2.5vw,2rem);border-right:2px solid var(--ink)}.filters{display:flex;flex-wrap:wrap;gap:.45rem;margin-bottom:1.4rem}.filter{padding:.52rem .75rem;border:1.5px solid var(--ink);border-radius:999px;background:transparent;font-size:.68rem;font-weight:800;cursor:pointer}.filter[aria-pressed=true]{background:var(--ink);color:var(--cream)}.list{display:grid;gap:.65rem}.entry{display:grid;grid-template-columns:auto 1fr auto;gap:.8rem;align-items:center;width:100%;padding:1rem;border:1.5px solid var(--ink);border-radius:.85rem;background:transparent;text-align:left;cursor:pointer;transition:.18s}.entry:hover{transform:translateX(4px)}.entry.active{background:var(--accent);box-shadow:4px 5px 0 var(--ink);transform:translate(-2px,-2px)}.num{font-family:Anton,Impact,sans-serif;font-size:1.6rem}.copy{min-width:0}.copy strong{display:block;overflow:hidden;font-size:.9rem;text-overflow:ellipsis;white-space:nowrap}.copy small{display:block;margin-top:.2rem;font-size:.68rem;opacity:.7}.detail{display:flex;flex-direction:column;justify-content:space-between;min-width:0;padding:clamp(1.5rem,4vw,3.5rem);background:var(--accent,var(--lavender));transition:background .25s}.count{margin:0 0 clamp(2.5rem,8vw,6rem);font-size:.7rem;font-weight:800;letter-spacing:.12em}.type{display:inline-block;margin-bottom:.8rem;padding:.42rem .65rem;border:1.5px solid;border-radius:999px;font-size:.66rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.detail h2{max-width:15ch;margin:0;font-family:Anton,Impact,sans-serif;font-size:clamp(2.8rem,6vw,6rem);font-weight:400;line-height:.88;text-transform:uppercase}.role{margin:.9rem 0 0;font-size:clamp(1rem,1.7vw,1.25rem);font-weight:750}.date{margin:.3rem 0 0;font-size:.76rem;font-weight:700;opacity:.65;text-transform:uppercase}.desc{max-width:47rem;margin:2rem 0 0;font-size:clamp(.95rem,1.35vw,1.08rem);line-height:1.65}.bottom{display:grid;grid-template-columns:1fr auto;gap:1.5rem;align-items:end;margin-top:3rem;padding-top:1.5rem;border-top:1.5px solid}.skills{display:flex;flex-wrap:wrap;gap:.45rem}.skills span{padding:.45rem .62rem;border:1.5px solid;border-radius:999px;font-size:.67rem;font-weight:750}.next{width:3.3rem;height:3.3rem;border:2px solid;border-radius:50%;background:transparent;font-size:1.35rem;cursor:pointer}.next:hover{transform:rotate(8deg);background:var(--cream)}.footer{display:flex;justify-content:space-between;gap:2rem;align-items:center;margin-top:5rem;padding:2rem 0;border-top:2px solid}.footer h2{max-width:16ch;margin:0;font-family:Anton,Impact,sans-serif;font-size:clamp(2rem,5vw,4.5rem);font-weight:400;line-height:.95;text-transform:uppercase}.footer a{padding:1rem 1.2rem;border:2px solid;border-radius:.75rem;background:var(--pink);font-size:.8rem;font-weight:800;text-decoration:none;box-shadow:4px 5px 0}
@media(max-width:800px){.hero{grid-template-columns:1fr}.explorer{grid-template-columns:1fr}.nav{border-right:0;border-bottom:2px solid}.list{display:flex;overflow-x:auto;padding-bottom:.5rem}.entry{min-width:15rem}.detail{min-height:34rem}}@media(max-width:560px){.shell{width:min(100% - 1.2rem,92rem)}.pill.dark span{display:none}h1{font-size:clamp(3.9rem,24vw,6rem)}.bottom{grid-template-columns:1fr}.footer{flex-direction:column;align-items:flex-start}}

<script>
(()=>{const entries=[
{company:'Cara',role:'Senior Sales Development Representative',date:'Apr 2026 — Present',type:'work',accent:'#7ae66a',desc:'I lead the evolution of our outbound and prospecting technology stack, implementing tools and maintaining the HubSpot data standards and dashboards behind a more scalable GTM motion. I also support onboarding, call hygiene, and workflow improvements across the team.',skills:['GTM operations','HubSpot','Sales tooling','Data quality','Enablement']},
{company:'Rippling',role:'Sales Development Representative',date:'Aug 2025 — Mar 2026',type:'work',accent:'#ca9dfe',desc:'I managed a high-volume outbound motion to HR, IT, and finance leaders across mid-market and SMB companies—building qualified pipeline through calls, email, and LinkedIn while bringing recurring buyer pain points back to process improvement.',skills:['Outbound','Discovery','Pipeline','HR technology','Buyer insight']},
{company:'Boston University',role:'M.S. Software Development',date:'2024 — 2025',type:'education',accent:'#ca9dfe',desc:'Graduate study deepened the engineering fundamentals behind the products I build—from data structures and architecture to the practices that make software reliable and maintainable. My broader professional development includes credentials in UX design, product management, software engineering, Python, Java, and object-oriented data structures.',skills:['Software design','Google UX','IBM Product Manager','IBM Software Engineer','Python & Java','Hindi · Gujarati · Spanish']},
{company:'M&R Consulting · TechForza',role:'Software Engineer & Technical Consultant',date:'May 2024 — Aug 2025',type:'work',accent:'#00c5c5',desc:'I built tools for field operations, including a real-time technician map and backend services that kept web and mobile data in sync. I also automated messy address processing and translated frontline needs into usable product decisions.',skills:['Flutter','REST APIs','Python','Firebase','Oracle','Product delivery']},
{company:'RevX Wellness',role:'Software Engineer Intern',date:'Jun 2024 — Sep 2024',type:'work',accent:'#f5c939',desc:'I cleaned and structured order and inventory data, then designed a dashboard that helped the team understand fulfillment without digging through disconnected spreadsheets.',skills:['Data cleanup','Dashboards','SQL','Operations']},
{company:'Apple',role:'Product Specialist',date:'Dec 2023 — Aug 2024',type:'work',accent:'#f897b4',desc:'I helped customers make confident technology choices, introduced emerging products such as Vision Pro, and made complex features feel practical and approachable. It taught me that the last mile of any product is human understanding.',skills:['Product demos','Accessibility','Customer experience','Communication']},
{company:'Vitality Robotics',role:'Software Engineer Intern',date:'Jul 2023 — Oct 2023',type:'work',accent:'#ff812d',desc:'My first software role put me inside a small, fast-moving team. I contributed to an AI assistant in Slack, supported system monitoring, and learned the rhythm of shipping through CI/CD.',skills:['AI assistants','Slack','Monitoring','CI/CD']},
{company:'UC Santa Barbara',role:'B.A. Architecture',date:'Sep 2019 — Jun 2023',type:'education',accent:'#00c5c5',desc:'Architecture taught me to work across constraints, systems, and human needs. Coursework in computational linguistics, machine learning, Python, and software development pulled that design thinking toward technology.',skills:['Design thinking','Python','Machine learning','Mentorship']},
{company:'Mentor Collective',role:'Senior Mentor',date:'During UCSB',type:'community',accent:'#7ae66a',desc:'I supported fellow students through one-on-one mentorship, helping them navigate questions, build confidence, and feel more connected to their university experience. The role strengthened the listening and communication skills I still bring to product and customer work.',skills:['Mentorship','Active listening','Peer support','Communication']}];let filter='all',active=0;const list=document.querySelector('#list'),visible=()=>entries.map((entry,index)=>({entry,index})).filter(x=>filter==='all'||x.entry.type===filter);function renderList(){const items=visible();if(!items.some(x=>x.index===active))active=items[0].index;list.innerHTML=items.map((x,i)=>`<button class="entry${x.index===active?' active':''}" style="--accent:${x.entry.accent}" data-index="${x.index}">
<span class="num">${String(i+1).padStart(2,'0')}</span>
<span class="copy">
<strong>${x.entry.company}</strong>
<small>${x.entry.date}</small>
</span>
<span>→</span>
</button>`).join('');list.querySelectorAll('.entry').forEach(b=>b.onclick=()=>{active=+b.dataset.index;renderList();renderDetail()})}function renderDetail(){const e=entries[active],pos=visible().findIndex(x=>x.index===active)+1;detail.style.setProperty('--accent',e.accent);count.textContent=`${String(pos).padStart(2,'0')} / ${String(visible().length).padStart(2,'0')}`;type.textContent=e.type;company.textContent=e.company;role.textContent=e.role;date.textContent=e.date;desc.textContent=e.desc;skills.innerHTML=e.skills.map(s=>`<span>${s}</span>`).join('')}document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.setAttribute('aria-pressed',x===b));renderList();renderDetail()});next.onclick=()=>{const items=visible(),i=items.findIndex(x=>x.index===active);active=items[(i+1)%items.length].index;renderList();renderDetail()};renderList();renderDetail()})();
</script>
